name: PatchSignal

description: Explainable, local-first change-impact analysis for safer code review and CI.
author: Alqudimi
branding:
  icon: shield
  color: blue

inputs:
  repo:
    description: Repository path to analyze.
    required: false
    default: .
  base:
    description: Git base revision. Leave empty for working-tree analysis.
    required: false
    default: ""
  head:
    description: Git head revision when base is provided.
    required: false
    default: HEAD
  format:
    description: "Report format: markdown, json, or sarif."
    required: false
    default: sarif
  output:
    description: Optional report path relative to the workspace.
    required: false
    default: patchsignal-report.sarif
  fail-on:
    description: "Exit threshold: never, medium, high, or critical."
    required: false
    default: high

runs:
  using: composite
  steps:
    - name: Install PatchSignal
      shell: bash
      working-directory: ${{ github.action_path }}
      run: python -m pip install .
    - name: Analyze change impact
      shell: bash
      env:
        PATCHSIGNAL_REPO: ${{ inputs.repo }}
        PATCHSIGNAL_BASE: ${{ inputs.base }}
        PATCHSIGNAL_HEAD: ${{ inputs.head }}
        PATCHSIGNAL_FORMAT: ${{ inputs.format }}
        PATCHSIGNAL_OUTPUT: ${{ inputs.output }}
        PATCHSIGNAL_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        args=(--repo "$PATCHSIGNAL_REPO" --format "$PATCHSIGNAL_FORMAT" --fail-on "$PATCHSIGNAL_FAIL_ON")
        if [[ -n "$PATCHSIGNAL_BASE" ]]; then
          args+=(--base "$PATCHSIGNAL_BASE" --head "$PATCHSIGNAL_HEAD")
        fi
        if [[ -n "$PATCHSIGNAL_OUTPUT" ]]; then
          args+=(--output "$PATCHSIGNAL_OUTPUT")
        fi
        patchsignal "${args[@]}"
