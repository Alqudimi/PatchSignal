name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Run tests with coverage
        run: python -m pytest --cov=patchsignal --cov-report=term-missing --cov-fail-under=85
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src tests scripts
      - name: Validate GitHub metadata
        run: |
          python scripts/validate_workflow.py
          python scripts/validate_action.py
      - name: Static security scan
        run: bandit -q -r src
      - name: Compile check
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Dependency consistency
        run: python -m pip check
