[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "patchsignal"
version = "0.3.0"
description = "Explainable, local-first change-impact analysis for safer code review and CI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PatchSignal contributors" }]
license = { file = "LICENSE" }
keywords = ["developer-tools", "change-impact", "code-review", "ci", "sarif", "static-analysis"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.optional-dependencies]
dev = ["bandit>=1.7", "mypy>=1.10", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
patchsignal = "patchsignal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchsignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]
